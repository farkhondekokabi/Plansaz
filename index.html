<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منتور هوشمند کسب‌وکار</title>
<style>
:root{
  --bg:#f7f5f2; --card:#ffffff; --ink:#1f1c19; --muted:#726b63;
  --accent:#b5652f; --accent2:#3f6b52; --line:#e6e0d8; --danger:#a1442f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17140f; --card:#211d18; --ink:#f1ece4; --muted:#a89d90;
    --accent:#e08a4c; --accent2:#6fae8c; --line:#332c24;
  }
}
:root[data-theme="dark"]{
  --bg:#17140f; --card:#211d18; --ink:#f1ece4; --muted:#a89d90;
  --accent:#e08a4c; --accent2:#6fae8c; --line:#332c24;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:"Vazirmatn","Segoe UI",Tahoma,sans-serif;
  line-height:1.7;
}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 60px;}
header{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding-bottom:10px;}
h1{font-size:1.35rem;margin:6px 0 4px;}
.sub{color:var(--muted);font-size:.92rem;margin-bottom:14px;}
.progress-row{display:flex;align-items:center;gap:10px;}
.bar{flex:1;height:10px;border-radius:6px;background:var(--line);overflow:hidden;}
.bar > div{height:100%;background:var(--accent2);transition:width .3s;}
.pct{font-size:.85rem;color:var(--muted);min-width:38px;text-align:left;}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:0 0 auto;padding:7px 12px;border-radius:20px;border:1px solid var(--line);
  background:var(--card);color:var(--muted);font-size:.82rem;cursor:pointer;white-space:nowrap;
}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin-inline-start:6px;}
.tab.done .dot{background:var(--accent2);}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:10px;}
.card h2{margin:0 0 10px;font-size:1.1rem;color:var(--accent);}
.questions{margin:0 0 12px;padding-inline-start:20px;color:var(--muted);font-size:.9rem;}
.questions li{margin-bottom:3px;}
textarea{
  width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;
  padding:12px;font-family:inherit;font-size:.95rem;background:var(--bg);color:var(--ink);resize:vertical;
}
.mentor{
  margin-top:12px;padding:12px 14px;border-radius:10px;background:color-mix(in srgb, var(--accent2) 12%, var(--card));
  border:1px solid var(--accent2);font-size:.87rem;
}
.mentor b{color:var(--accent2);}
.checklist{margin-top:10px;font-size:.85rem;color:var(--muted);}
.checklist label{display:flex;gap:8px;align-items:flex-start;margin-bottom:4px;cursor:pointer;}
.nav-btns{display:flex;justify-content:space-between;margin-top:16px;gap:10px;}
.nav-btns button{
  padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);cursor:pointer;font-size:.88rem;
}
.nav-btns button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.status{font-size:.78rem;color:var(--muted);margin-top:8px;min-height:16px;}
.overview{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:14px;}
.ov-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);font-size:.85rem;}
.ov-card b{display:block;margin-bottom:4px;}
.ov-card span{color:var(--muted);}

#gate{
  position:fixed;inset:0;background:var(--bg);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
#gate .box{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:28px 24px;max-width:360px;width:100%;text-align:center;
}
#gate h2{margin:0 0 6px;font-size:1.15rem;}
#gate p{color:var(--muted);font-size:.88rem;margin:0 0 16px;}
#gate input{
  width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font-size:.95rem;text-align:center;margin-bottom:10px;
}
#gate button{
  width:100%;padding:11px;border-radius:9px;border:none;background:var(--accent);
  color:#fff;font-size:.95rem;cursor:pointer;
}
#gate .err{color:var(--danger);font-size:.82rem;min-height:18px;margin-top:8px;}
body.locked > .wrap{display:none;}
.aibtn{margin-top:12px;padding:10px 16px;border-radius:9px;border:1px solid var(--accent2);background:transparent;color:var(--accent2);cursor:pointer;font-size:.9rem;width:100%;}
.aibtn:disabled{opacity:.6;cursor:wait;}
.ai{margin-top:12px;font-size:.88rem;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);}
.ai h4{margin:10px 0 4px;font-size:.9rem;color:var(--accent);}
.ai ul{margin:0;padding-inline-start:18px;}
.score{display:inline-block;padding:2px 10px;border-radius:12px;background:var(--accent2);color:#fff;font-weight:bold;}
.docbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
.docbtns button{flex:1;min-width:150px;padding:11px;border-radius:9px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:.9rem;}
.docbtns button:disabled{opacity:.6;cursor:wait;}
#docView{display:none;margin-top:14px;line-height:1.9;}
#docView h2,#docView h3{color:var(--accent);} .li{margin:2px 0;padding-inline-start:10px;}
@media print{#docView .nav-btns{display:none}.wrap > *:not(#docView){display:none!important} #docView{display:block!important;border:none;color:#000;background:#fff}}
</style>
</head>

</div>

let state = {};
SECTIONS.forEach(s => state[s.id] = "");
let current = 0;
let saveTimer = null;
let currentCode = null;

function wordCount(t){ return (t.trim().match(/\S+/g) || []).length; }
function isDone(id){ return wordCount(state[id]) >= 15; }
function progressPct(){
  const done = SECTIONS.filter(s => isDone(s.id)).length;
  return Math.round((done / SECTIONS.length) * 100);
}

function renderTabs(){
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  SECTIONS.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = "tab" + (i === current ? " active" : "") + (isDone(s.id) ? " done" : "");
    b.innerHTML = s.title + '<span class="dot"></span>';
    b.onclick = () => { current = i; renderAll(); };
    tabs.appendChild(b);
  });
}

function renderSection(){
  const s = SECTIONS[current];
  const card = document.getElementById("sectionCard");
  card.innerHTML = `
    <h2>${current+1}. ${s.title}</h2>
    <ul class="questions">${s.questions.map(q => `<li>${q}</li>`).join("")}</ul>
    <textarea id="ta" placeholder="پاسخ‌ات رو اینجا بنویس...">${esc(state[s.id] || "")}</textarea>
    <div class="mentor"><b>راهنمای منتور:</b> ${s.tip}</div>
    <button class="aibtn" id="aiBtn">🧠 تحلیل هوشمند این بخش</button>
    <div id="aiBox"></div>
    <div class="nav-btns">
      <button id="prevBtn" ${current===0?"disabled":""}>◀ قبلی</button>
      <button class="primary" id="nextBtn">${current===SECTIONS.length-1?"پایان":"بعدی ▶"}</button>
    </div>
  `;
  const ta = document.getElementById("ta");
  ta.addEventListener("input", () => {
    state[s.id] = ta.value;
    renderTabs();
    renderProgress();
    renderOverview();
    scheduleSave();
  });
  document.getElementById("aiBtn").onclick = analyze;
  renderAi();
  document.getElementById("prevBtn").onclick = () => { current = Math.max(0, current-1); renderAll(); };
  document.getElementById("nextBtn").onclick = () => { current = Math.min(SECTIONS.length-1, current+1); renderAll(); };
}

function renderProgress(){
  const p = progressPct();
  document.getElementById("barFill").style.width = p + "%";
  document.getElementById("pctText").textContent = p.toLocaleString("fa-IR") + "٪";
}

function renderOverview(){
  const ov = document.getElementById("overview");
  ov.innerHTML = SECTIONS.map(s => `
    <div class="ov-card">
      <b>${isDone(s.id) ? "✅" : "◻️"} ${s.title}</b>
      <span>${wordCount(state[s.id])} کلمه${(state._ai&&state._ai[s.id])?" · امتیاز "+state._ai[s.id].score:""}</span>
    </div>
  `).join("");
}

function renderAll(){
  renderTabs();
  renderSection();
  renderProgress();
  renderOverview();
}

function setStatus(t){
  document.getElementById("statusLine").textContent = t;
}

function scheduleSave(){
  setStatus("در حال ذخیره...");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 700);
}

function dataKey(){ return "bpf_data_" + currentCode; }

async function saveState(){
  try{ localStorage.setItem(dataKey(), JSON.stringify({data: state, updatedAt: Date.now()})); }catch(e){}

  try{
    const { error } = await sb.rpc("upsert_plan", { p_code: currentCode, p_data: state });
    if(error) throw error;
    setStatus("ذخیره شد ✓");
  }catch(e){
    setStatus("ذخیره شد (فقط روی همین دستگاه) ✓");
  }
}
