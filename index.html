<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پلن‌ساز | دستیار ساخت بیزنس‌پلن</title>
<style>
:root{
  --bg:#F5F7FA;
  --card:#FFFFFF;
  --ink:#172033;
  --muted:#64748B;
  --accent:#172554;
  --accent2:#0EA5A4;
  --line:#E2E8F0;
  --danger:#DC2626;
  --success:#16A34A;
  --accent-soft:#CCFBF1;
  --navy-soft:#E0E7FF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1220; --card:#111827; --ink:#F8FAFC; --muted:#94A3B8;
    --accent:#172554; --accent2:#14B8A6; --line:#263244;
    --danger:#EF4444; --success:#22C55E;
    --accent-soft:#134E4A; --navy-soft:#1E293B;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1220; --card:#111827; --ink:#F8FAFC; --muted:#94A3B8;
  --accent:#172554; --accent2:#14B8A6; --line:#263244;
  --danger:#EF4444; --success:#22C55E;
  --accent-soft:#134E4A; --navy-soft:#1E293B;
}
html{height:100%;scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Vazirmatn","Segoe UI",Tahoma,sans-serif;line-height:1.7;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 60px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-bottom:10px}
h1{font-size:1.45rem;margin:6px 0 4px;font-weight:800;letter-spacing:-.5px;color:var(--accent)}
.sub{color:var(--muted);font-size:.92rem;margin-bottom:14px}
.progress-row{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
.pct{font-size:.85rem;color:var(--muted);min-width:38px;text-align:left}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:7px 12px;border-radius:20px;border:1px solid var(--line);
  background:var(--card);color:var(--muted);font-size:.82rem;cursor:pointer;white-space:nowrap;
  transition:all .2s}
.tab:hover{border-color:var(--accent2);color:var(--accent2)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin-inline-start:6px}
.tab.done .dot{background:var(--accent2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:10px;transition:border-color .2s}
.card:hover{border-color:#CBD5E1}
.card h2{margin:0 0 10px;font-size:1.1rem;color:var(--accent)}
.questions{margin:0 0 12px;padding-inline-start:20px;color:var(--muted);font-size:.9rem}
.questions li{margin-bottom:3px}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;
  padding:12px;font-family:inherit;font-size:.95rem;background:var(--bg);color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--accent2)}
.mentor{margin-top:12px;padding:12px 14px;border-radius:10px;
  background:var(--accent-soft);border-right:4px solid var(--accent2);font-size:.87rem}
.mentor b{color:var(--accent);font-weight:700}
.nav-btns{display:flex;justify-content:space-between;margin-top:16px;gap:10px}
.nav-btns button{padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);cursor:pointer;font-size:.88rem;transition:all .2s}
.nav-btns button:hover:not(:disabled){border-color:var(--accent)}
.nav-btns button:disabled{opacity:.4;cursor:not-allowed}
.nav-btns button.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(23,37,84,.16)}
.nav-btns button.primary:hover:not(:disabled){background:#1E3A8A}
.status{font-size:.78rem;color:var(--muted);margin-top:8px;min-height:16px}
.overview{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:14px}
.ov-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);font-size:.85rem}
.ov-card b{display:block;margin-bottom:4px;color:var(--accent)}
.ov-card span{color:var(--muted)}
#gate{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
#gate .box{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:28px 24px;max-width:360px;width:100%;text-align:center}
#gate h2{margin:0 0 6px;font-size:1.2rem;color:var(--accent)}
#gate p{color:var(--muted);font-size:.88rem;margin:0 0 16px}
#gate input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font-size:.95rem;text-align:center;margin-bottom:10px}
#gate input:focus{outline:none;border-color:var(--accent2)}
#gate button{width:100%;padding:11px;border-radius:9px;border:none;background:var(--accent);
  color:#fff;font-size:.95rem;cursor:pointer;font-weight:600}
#gate .err{color:var(--danger);font-size:.82rem;min-height:18px;margin-top:8px}
body.locked>.wrap{display:none}
.aibtn{margin-top:12px;padding:11px 16px;border-radius:9px;border:none;background:var(--accent2);color:#fff;cursor:pointer;font-size:.9rem;width:100%;font-weight:600;box-shadow:0 6px 18px rgba(14,165,164,.20);transition:all .2s}
.aibtn:hover:not(:disabled){background:#0F8F8D;transform:translateY(-1px)}
.aibtn:disabled{opacity:.6;cursor:wait}
.ai{margin-top:12px;font-size:.88rem;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg)}
.ai h4{margin:10px 0 4px;font-size:.9rem;color:var(--accent)}
.ai ul{margin:0;padding-inline-start:18px}
.score{display:inline-block;padding:3px 12px;border-radius:12px;background:var(--accent2);color:#fff;font-weight:bold;font-size:.85rem}
.docbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.docbtns button{flex:1;min-width:150px;padding:12px;border-radius:9px;border:none;
  background:var(--accent);color:#fff;cursor:pointer;font-size:.9rem;transition:all .2s;font-weight:600;box-shadow:0 6px 16px rgba(23,37,84,.16)}
.docbtns button:hover:not(:disabled){background:#1E3A8A}
.docbtns button:disabled{opacity:.6;cursor:wait}
#docView{display:none;margin-top:14px;line-height:1.9;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:16px}
#docView h2,#docView h3{color:var(--accent)}
#docView h2{border-bottom:2px solid var(--accent2);padding-bottom:6px;margin-top:24px}
#docView h3{margin-top:18px}
.li{margin:2px 0;padding-inline-start:10px}
.sharebtn{margin-top:12px;padding:11px 16px;border-radius:9px;border:1px solid var(--accent2);
  background:transparent;color:var(--accent2);cursor:pointer;font-size:.9rem;width:100%;font-weight:600;transition:all .2s}
.sharebtn:hover{background:var(--accent2);color:#fff}
#adminPanel{display:none;margin-top:20px;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:16px}
#adminPanel h3{color:var(--accent);margin-top:0}
.admin-code{display:flex;justify-content:space-between;padding:8px 12px;border:1px solid var(--line);
  border-radius:8px;margin-bottom:6px;font-size:.85rem;align-items:center}
.admin-code button{padding:5px 12px;border-radius:6px;border:none;background:var(--danger);color:#fff;cursor:pointer;font-size:.75rem;font-weight:600}
.admin-code button.on{background:var(--success)}
.admin-add{display:flex;gap:6px;margin-top:10px}
.admin-add input{flex:1;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit}
.admin-add input:focus{outline:none;border-color:var(--accent2)}
.admin-add button{padding:9px 16px;border-radius:8px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-weight:600}
@media print{
  .wrap>*:not(#docView){display:none!important}
  #docView{display:block!important;border:none;color:#000;background:#fff;box-shadow:none}
  .docbtns,.sharebtn,.nav-btns,.tabs,.adminbtn,#adminPanel{display:none!important}
}
</style>
</head>
<body class="locked">
<div id="gate">
  <div class="box">
    <h2>🔒 دسترسی محدود</h2>
    <p>برای استفاده از پلن‌ساز، کد دسترسی اختصاصی‌ات رو وارد کن.</p>
    <input type="text" id="gateInput" placeholder="کد دسترسی" autocomplete="off">

</div>
<div class="wrap">
<header>
  <h1>پلن‌ساز</h1>

  <div class="progress-row">

<div class="card" id="docView"></div>

<div class="status" id="docStatus"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SECTIONS = [
  {id:"idea", title:"ایده و مسئله", questions:[
    "چه مشکلی رو حل می‌کنی؟ برای چه کسانی؟",
    "چرا الان زمان مناسبیه برای این ایده؟"
  ], tip:"مسئله رو با یک مثال واقعی و عینی توضیح بده، نه با کلی‌گویی. اگر نمی‌تونی مشکل رو در یک جمله ساده بگی، هنوز به‌اندازه کافی شفاف نیست."},

  {id:"solution", title:"راه‌حل و محصول", questions:[
    "راه‌حل تو دقیقاً چیه و چطور کار می‌کنه؟",
    "چرا این راه‌حل بهتر از جایگزین‌های فعلیه؟"
  ], tip:"روی یک مزیت اصلی (Unique Value) تمرکز کن. سعی نکن همه‌چیز رو حل کنی؛ بهترین بیزنس‌پلن‌ها روی یک نقطه قوت واضح تکیه می‌کنند."},

  {id:"market", title:"بازار هدف و مشتری", questions:[

  ], tip:"از یک عدد قابل دفاع استفاده کن (منبع، تحقیق، یا محاسبه‌ی ساده). ادعای 'بازار میلیارد دلاری' بدون منبع اعتبار نداره."},

  {id:"revenue", title:"مدل درآمدی", questions:[
    "چطور پول درمیاری؟ (اشتراک، تراکنشی، تبلیغاتی...)",
    "قیمت‌گذاری اولیه چقدره و چرا؟"
  ], tip:"مدل درآمدی باید با رفتار واقعی مشتری هم‌خوانی داشته باشه. اگر مشتری عادت به پرداخت ماهانه نداره، مدل اشتراکی ریسک بالایی داره."},

  {id:"competition", title:"رقبا و مزیت رقابتی", questions:[
    "رقبای مستقیم و غیرمستقیم کی‌ان؟",
    "چرا مشتری تو رو به جای اون‌ها انتخاب می‌کنه؟"
  ], tip:"حداقل دو رقیب واقعی رو نام ببر. نبود رقیب معمولاً یعنی بازار وجود نداره، نه اینکه ایده‌ات بی‌نظیره."},

  {id:"marketing", title:"استراتژی جذب مشتری", questions:[
    "اولین ۱۰۰ مشتری رو از کجا میاری؟",
    "هزینه جذب هر مشتری (CAC) تقریباً چقدره؟"
  ], tip:"روی یک یا دو کانال اصلی تمرکز کن، نه ده کانال به‌طور سطحی. عمق در یک کانال از پخش‌شدن در همه جا مؤثرتره."},

  {id:"team", title:"تیم", questions:[
    "چه کسانی در تیم هستند و مهارت هرکدام چیه؟",
    "چه نقشی هنوز خالیه؟"
  ], tip:"روی تجربه‌ی مرتبط با این مسئله‌ی خاص تمرکز کن، نه فقط رزومه‌ی کلی."},

  {id:"financials", title:"مالی و بودجه", questions:[
    "هزینه‌های ثابت و متغیر ماهانه چقدره؟",
    "به چه مبلغی و برای چه مدتی نیاز داری؟"
  ], tip:"یک پیش‌بینی ساده و محافظه‌کارانه بهتر از یک مدل پیچیده و خوش‌بینانه‌ست. فرض‌های کلیدی رو صریح بنویس."},

  {id:"roadmap", title:"نقشه راه", questions:[
    "۳ ماه، ۶ ماه و ۱۲ ماه آینده چه اتفاقی می‌افته؟",
    "مهم‌ترین نقطه عطف (Milestone) بعدی چیه؟"
  ], tip:"مراحل رو به گونه‌ای تعریف کن که قابل اندازه‌گیری باشند (مثلاً '۵۰۰ کاربر فعال'، نه 'رشد خوب')."},

  {id:"risks", title:"ریسک‌ها و راه مقابله", questions:[
    "بزرگ‌ترین ریسکی که می‌تونه این کسب‌وکار رو شکست بده چیه؟",
    "برای هرکدوم چه برنامه‌ای داری؟"
  ], tip:"صادقانه بزرگ‌ترین نقطه‌ضعف رو بنویس. مخفی‌کردن ریسک به کسی کمک نمی‌کنه؛ داشتن برنامه‌ی B اعتماد ایجاد می‌کنه."}
];

const SUPABASE_URL = "https://cbpihoekujvrqhnbhvjl.supabase.co";
const SUPABASE_KEY = "sb_publishable_lY4ReO3fBBXLM3BnrpfBZg_Av0XZSwx";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let state = {};
SECTIONS.forEach(s => state[s.id] = "");
let current = 0;
let saveTimer = null;
let currentCode = null;
let isAdmin = false;

function wordCount(t){ return (t.trim().match(/\S+/g) || []).length; }
function isDone(id){ return wordCount(state[id]) >= 15; }
function progressPct(){
  const done = SECTIONS.filter(s => isDone(s.id)).length;
  return Math.round((done / SECTIONS.length) * 100);
}
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderTabs(){
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  SECTIONS.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = "tab" + (i === current ? " active" : "") + (isDone(s.id) ? " done" : "");
    b.innerHTML = s.title + '<span class="dot"></span>';
    b.onclick = () => { current = i; renderAll(); };
    tabs.appendChild(b);
  });
}

function renderSection(){
  const s = SECTIONS[current];
  const card = document.getElementById("sectionCard");
  card.innerHTML = `
    <h2>${current+1}. ${s.title}</h2>
    <ul class="questions">${s.questions.map(q => `<li>${esc(q)}</li>`).join("")}</ul>
    <textarea id="ta" placeholder="پاسخ‌ات رو اینجا بنویس...">${esc(state[s.id] || "")}</textarea>
    <div class="mentor"><b>راهنمای پلن‌ساز:</b> ${esc(s.tip)}</div>
    <button class="aibtn" id="aiBtn">🧠 تحلیل هوشمند این بخش</button>
    <div id="aiBox"></div>
    <div class="nav-btns">
      <button id="prevBtn" ${current===0?"disabled":""}>◀ قبلی</button>
      <button class="primary" id="nextBtn">${current===SECTIONS.length-1?"پایان":"بعدی ▶"}</button>
    </div>
  `;
  const ta = document.getElementById("ta");
  ta.addEventListener("input", () => {
    state[s.id] = ta.value;
    renderTabs();
    renderProgress();
    renderOverview();
    scheduleSave();
  });
  document.getElementById("aiBtn").onclick = analyze;
  renderAi();
  document.getElementById("prevBtn").onclick = () => { current = Math.max(0, current-1); renderAll(); };
  document.getElementById("nextBtn").onclick = () => { current = Math.min(SECTIONS.length-1, current+1); renderAll(); };
}

function renderProgress(){
  const p = progressPct();
  document.getElementById("barFill").style.width = p + "%";
  document.getElementById("pctText").textContent = p.toLocaleString("fa-IR") + "٪";
}

function renderOverview(){
  const ov = document.getElementById("overview");
  ov.innerHTML = SECTIONS.map(s => `
    <div class="ov-card">
      <b>${isDone(s.id) ? "✅" : "◻️"} ${s.title}</b>
      <span>${wordCount(state[s.id])} کلمه${(state._ai&&state._ai[s.id])?" · امتیاز "+state._ai[s.id].score:""}</span>
    </div>
  `).join("");
}

function renderAll(){
  renderTabs();
  renderSection();
  renderProgress();
  renderOverview();
}

function setStatus(t){
  document.getElementById("statusLine").textContent = t;
}

function scheduleSave(){
  setStatus("در حال ذخیره...");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 700);
}

function dataKey(){ return "bpf_data_" + currentCode; }

async function saveState(){
  try{ localStorage.setItem(dataKey(), JSON.stringify({data: state, updatedAt: Date.now()})); }catch(e){}
  try{
    const { error } = await sb.rpc("upsert_plan", { p_code: currentCode, p_data: state });
    if(error) throw error;
    setStatus("ذخیره شد ✓");
  }catch(e){
    setStatus("ذخیره شد (فقط روی همین دستگاه) ✓");
  }
}
  const KNOWLEDGE_BASE = {
  idea: [
    { id:"idea_problem_clear", required:true, depends_on:[], min_positive_matches:1, score_if_pass:10, score_if_fail:-15,
      positive_signs:["مشکل|دردسر|چالش|کمبود|نمی‌تونن|نمی‌توانند|سخته|گره|مانع"],
      negative_signs:["ایده خوبیه|فکر کنم|شاید","همه چی خوبه"],
      feedback:"مسئله‌ای که حل می‌کنی واضح بیان نشده — هنوز معلوم نیست دقیقاً چه دردی رو دوا می‌کنی.",
      feedback_pass:"مسئله‌ی اصلی که حل می‌کنی واضح و مشخص بیان شده.",
      follow_up_questions:["دقیقاً چه مشکلی رو حل می‌کنی؟ یه مثال واقعی بزن."],
      improvement_suggestions:["مسئله رو در یک جمله بنویس: «X نمی‌تونه Y رو انجام بده چون Z.»"] },
    { id:"idea_who_affected", required:true, depends_on:[], min_positive_matches:1, score_if_pass:8, score_if_fail:-10,
      positive_signs:["مشتری|کاربر|افراد|کسانی که|گروهی که|دانشجو|کارمند|مادر|پدر|کسب‌وکار|فریلنسر|مدیر"],

      follow_up_questions:["چرا فکر می‌کنی حاضره پول بده؟"],
      improvement_suggestions:["بنویس مشتری الان چقدر خرج می‌کنه."] },
    { id:"market_vague", required:false, depends_on:[], min_positive_matches:1, score_if_pass:0, score_if_fail:-4,
      positive_signs:[], negative_signs:["شاید|احتمالا|فکر کنم|به نظرم بازار خوبیه|بازار بزرگیه"],
      feedback:"پاسخ پر از عبارات مبهم است.", feedback_pass:"", follow_up_questions:[],
      improvement_suggestions:["عبارات مبهم رو با اطلاعات مشخص جایگزین کن."] }
  ]
};

function testAny(patterns, text){ return patterns.some(p => new RegExp(p, "i").test(text)); }
function countMatches(patterns, text){ return patterns.filter(p => new RegExp(p, "i").test(text)).length; }
function orderByDependency(rules){
  const byId = Object.fromEntries(rules.map(r => [r.id, r])); const done = new Set(), ordered = [];
  function visit(r){ if(done.has(r.id)) return; (r.depends_on||[]).forEach(d => byId[d] && visit(byId[d])); done.add(r.id); ordered.push(r); }
  rules.forEach(visit); return ordered;
}
function evaluateSection(sectionId, answer){
  const rules = orderByDependency(KNOWLEDGE_BASE[sectionId] || []);
  const results = {}; let score = 40;
  const words = wordCount(answer);
  if(words < 20) score -= 15;
  else if(words < 40) score -= 5;
  else if(words > 150) score += 5;
  const sentences = (answer.match(/[.!?؟。]/g) || []).length;
  if(sentences < 2) score -= 5;
  const uniqueness = new Set((answer.match(/\S+/g) || []).map(w => w.toLowerCase())).size;
  const totalWords = (answer.match(/\S+/g) || []).length;
  if(totalWords > 0 && uniqueness / totalWords < 0.5) score -= 5;
  const weaknesses=[], strengths=[], followups=[], suggestions=[];
  for(const r of rules){
    const depsOk = (r.depends_on||[]).every(d => results[d] === "pass" || results[d] === "partial");
    if((r.depends_on||[]).length && !depsOk){ results[r.id]="skipped"; continue; }
    const negHit = r.negative_signs.length && testAny(r.negative_signs, answer);
    let status;
    if(negHit) status = "fail";
    else if(r.positive_signs.length){
      const n = countMatches(r.positive_signs, answer);
      status = n >= (r.min_positive_matches||1) ? "pass" : (n>0 ? "partial" : "unclear");
    } else status = "unclear";
    if(status==="fail" || (status==="unclear" && r.required) || status==="partial"){
      score += status==="partial" ? Math.round(r.score_if_fail/2) : r.score_if_fail;
      if(r.feedback) weaknesses.push(r.feedback);
      followups.push(...(r.follow_up_questions||[])); suggestions.push(...(r.improvement_suggestions||[]));
      results[r.id] = status==="partial" ? "partial" : "fail";
    } else if(status==="pass"){
      score += r.score_if_pass; if(r.feedback_pass) strengths.push(r.feedback_pass); results[r.id]="pass";
    } else results[r.id]="unclear";
  }
  score = Math.max(0, Math.min(100, score));
  return { score, weaknesses, strengths, followups, suggestions, results, words };
}
function explainScore({score, weaknesses, strengths, words}){
  const tier = score>=85?"عالی":score>=70?"قابل اجرا":score>=50?"نیاز به بازنگری":"ضعیف";
  const wordInfo = words ? " (" + words + " کلمه)" : "";
  const clause = weaknesses[0] ? " — " + weaknesses[0] : (strengths[0] ? " — " + strengths[0] : "");
  return score+"/100"+wordInfo+" — "+tier+clause;
}

function analyze(){
  const s = SECTIONS[current], box = document.getElementById("aiBox"), btn = document.getElementById("aiBtn");
  if(!KNOWLEDGE_BASE[s.id]){ box.innerHTML = '<div class="ai">تحلیل هوشمند این بخش هنوز آماده نیست.</div>'; return; }
  if(wordCount(state[s.id]) < 10){ box.innerHTML = '<div class="ai">اول یه پاسخ کامل‌تر بنویس (حداقل چند جمله).</div>'; return; }
  btn.disabled = true;
  setTimeout(() => {
    const r = evaluateSection(s.id, state[s.id]);
    state._ai = state._ai || {}; state._ai[s.id] = r;
    scheduleSave(); renderOverview();
    btn.disabled = false; renderAi();
  }, 300);
}
function renderAi(){
  const s = SECTIONS[current], r = state._ai && state._ai[s.id], box = document.getElementById("aiBox");
  if(!r){ box.innerHTML = ""; return; }
  const list = (t, a) => (a && a.length) ? "<h4>"+t+"</h4><ul>"+a.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>" : "";
  box.innerHTML = '<div class="ai"><span class="score">'+esc(explainScore(r))+'</span>'
    + list("نقاط قوت", r.strengths) + list("ضعف‌ها", r.weaknesses)
    + list("پیشنهادهای اصلاح", r.suggestions)
    + list("سؤال‌های پیگیری (جواب بده و دوباره تحلیل کن)", r.followups) + "</div>";
}

function buildBusinessPlan(){
  const date = new Date().toLocaleDateString("fa-IR");
  let html = `<h2>📄 بیزنس پلن کامل</h2>`;
  html += `<p style="color:var(--muted);font-size:.85rem">تاریخ: ${date}</p>`;

  SECTIONS.forEach((s, i) => {
    const answer = (state[s.id] || "").trim();
    if(!answer) return;
    const ai = state._ai && state._ai[s.id];
    html += `<h3>${i+1}. ${esc(s.title)}</h3>`;
    html += `<div style="white-space:pre-wrap;line-height:1.9;margin:8px 0 12px">${esc(answer)}</div>`;
    if(ai){
      html += `<div style="background:var(--accent-soft);border-right:3px solid var(--accent2);padding:8px 12px;border-radius:8px;font-size:.85rem;margin-bottom:14px">`;
      html += `<b>امتیاز: ${ai.score}/100</b>`;
      if(ai.strengths.length) html += `<div style="margin-top:4px">✅ ${ai.strengths.map(esc).join(" · ")}</div>`;
      if(ai.weaknesses.length) html += `<div style="margin-top:4px">⚠️ ${ai.weaknesses.map(esc).join(" · ")}</div>`;
      html += `</div>`;
    }
  });

  const done = SECTIONS.filter(s => isDone(s.id)).length;
  const avg = SECTIONS.filter(s => state._ai && state._ai[s.id]).length
    ? Math.round(SECTIONS.filter(s => state._ai && state._ai[s.id]).reduce((a,s)=>a+state._ai[s.id].score,0) / SECTIONS.filter(s => state._ai && state._ai[s.id]).length)
    : 0;

  html += `<h2>📊 خلاصه</h2>`;
  html += `<div class="li">بخش‌های تکمیل‌شده: <b>${done} از ${SECTIONS.length}</b></div>`;
  if(avg) html += `<div class="li">میانگین امتیاز: <b>${avg}/100</b></div>`;
  return html;
}

<div class="li"><b>هفته ۳:</b> تست نمونه اولیه با ۱۰ کاربر واقعی. ثبت بازخورد.</div>

<div class="li"><b>هفته ۵-۶:</b> راه‌اندازی کانال جذب اول: <i>${short(channel)}</i>.</div>
<div class="li"><b>هفته ۷:</b> اولین ۱۰ مشتری. آزمایش مدل درآمدی: <i>${short(money)}</i>.</div>
<div class="li"><b>هفته ۸:</b> تحلیل بازخورد. تنظیم قیمت یا پیشنهاد.</div>

<h3>ماه سوم: رشد و پایداری</h3>
<div class="li"><b>هفته ۹-۱۰:</b> افزایش جذب تا ۵۰ مشتری. اندازه‌گیری هزینه‌ی جذب (CAC).</div>

<div class="li">✅ ۵۰-۱۰۰ مشتری فعال</div>
<div class="li">✅ مدل درآمدی تأییدشده</div>
<div class="li">✅ آماده بودن برای جذب سرمایه یا رشد</div>
`;
}

document.getElementById("adminToggle").onclick = () => {
  const panel = document.getElementById("adminPanel");
  panel.style.display = panel.style.display === "block" ? "none" : "block";

async function loadAdminCodes(){
  const box = document.getElementById("adminCodes");
  box.innerHTML = "در حال بارگذاری...";
  try{
    const { data, error } = await sb.rpc("list_codes");
    if(error) throw error;
    if(!data || !data.length){ box.innerHTML = "هیچ کدی یافت نشد."; return; }
    box.innerHTML = data.map(c => `
      <div class="admin-code">
        <span>${esc(c.code)}</span>
        <button data-code="${esc(c.code)}" data-active="${c.active}" class="${c.active?'on':''}">
          ${c.active ? 'فعال ✓' : 'غیرفعال'}
        </button>
      </div>
    `).join("");
    box.querySelectorAll("button").forEach(b => {
      b.onclick = async () => {
        const code = b.dataset.code;
        const newActive = b.dataset.active !== "true";
        b.disabled = true;
        try{
          const { error } = await sb.rpc("toggle_code", { p_code: code, p_active: newActive });
          if(error) throw error;
          loadAdminCodes();
        }catch(e){
          document.getElementById("adminStatus").textContent = "خطا در تغییر وضعیت";
          b.disabled = false;
        }
      };
    });
  }catch(e){
    box.innerHTML = "خطا در بارگذاری. مطمئن شو تابع list_codes در Supabase ساخته شده.";
  }
}

document.getElementById("addCodeBtn").onclick = async () => {
  const input = document.getElementById("newCodeInput");
  const code = input.value.trim();
  const status = document.getElementById("adminStatus");
  if(!code){ status.textContent = "کد رو وارد کن."; return; }
  status.textContent = "در حال افزودن...";
  try{
    const { error } = await sb.rpc("add_code", { p_code: code });
    if(error) throw error;
    input.value = "";
    status.textContent = "کد اضافه شد ✓";
    loadAdminCodes();
  }catch(e){
    status.textContent = "خطا: " + (e.message || "نتونست اضافه کنه");
  }
};
  // ============ قفل و احراز هویت ============

const LOCK_KEY = "bpf_unlocked_code_v1";
const ADMIN_CODE = "test1234";

async function verifyCode(code){
  try{
    const { data, error } = await sb.rpc("check_code", { p_code: code });
    return !error && data === true;
  }catch(e){ return false; }
}

function openApp(code){
  currentCode = code;
  isAdmin = (code === ADMIN_CODE);
  document.body.classList.remove("locked");
  document.getElementById("gate").style.display = "none";
  if(isAdmin){
    document.getElementById("adminToggle").style.display = "block";
  }
  init();
}

async function tryUnlock(code){
  const c = code.trim();
  if(!c) return false;
  if(await verifyCode(c)){
    try{ localStorage.setItem(LOCK_KEY, c); }catch(e){}
    openApp(c);
    return true;
  }
  return false;
}

(async function checkLock(){
  const btn = document.getElementById("gateBtn");
  const err = document.getElementById("gateErr");
  btn.onclick = async () => {
    err.textContent = "";
    btn.disabled = true;
    btn.textContent = "در حال بررسی...";
    const ok = await tryUnlock(document.getElementById("gateInput").value);
    btn.disabled = false;
    btn.textContent = "ورود";
    if(!ok) err.textContent = "کد اشتباهه یا معتبر نیست.";
  };
  document.getElementById("gateInput").addEventListener("keydown", e => {
    if(e.key === "Enter") btn.click();
  });

  let saved = null;
  try{ saved = localStorage.getItem(LOCK_KEY); }catch(e){}
  if(saved && await verifyCode(saved)) openApp(saved);
})();

// ============ راه‌اندازی اولیه ============

async function init(){
  let localData = null;
  try{
    const raw = localStorage.getItem(dataKey());
    if(raw){ localData = JSON.parse(raw).data; }
  }catch(e){}

  let remoteData = null;
  try{
    const { data, error } = await sb.rpc("get_plan", { p_code: currentCode });
    if(!error && data) remoteData = data;
  }catch(e){}

  const best = remoteData || localData;
  if(best){
    SECTIONS.forEach(s => { if(best[s.id]) state[s.id] = best[s.id]; });
    if(best._ai) state._ai = best._ai;
  }
  renderAll();
}
